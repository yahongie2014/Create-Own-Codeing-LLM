services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
      - ./models/coder79:/app/model:ro
    deploy:
      resources:
        limits:
          cpus: '6.0'        # Restrict to 6 cores so your PC stays snappy
          memory: 16G        # Hard cap at 16 GB RAM
        reservations:
          memory: 8G
    environment:
      - OLLAMA_NUM_PARALLEL=1 # Keep single-threaded execution queue clean
      - OLLAMA_NOPRINT=1
      - OLLAMA_HOST=0.0.0.0:11434
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  ollama-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "127.0.0.1:3000:8080"
    environment:
      - ENABLE_OLLAMA_API=false
      - OPENAI_API_BASE_URLS=http://coder79-agent:8000/v1
      - OPENAI_API_KEYS=local-only
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      coder79-agent:
        condition: service_healthy
    restart: unless-stopped

  coder79-model-init:
    image: ollama/ollama:latest
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        until ollama list >/dev/null 2>&1; do sleep 2; done
        pull_model() {
          model="$$1"
          attempt=1
          until ollama pull "$$model"; do
            if [ "$$attempt" -ge 5 ]; then
              echo "Failed to download $$model after 5 attempts." >&2
              exit 1
            fi
            echo "$$model download failed (attempt $$attempt/5); retrying in 10 seconds." >&2
            attempt=$$((attempt + 1))
            sleep 10
          done
        }
        pull_model qwen2.5-coder:3b
        pull_model qwen2.5-coder:1.5b
        ollama create coder79 -f /app/model/Modelfile
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./models/coder79:/app/model:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  coder79-agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    command:
      - --transport
      - openai
      - --workspace
      - /workspace
      - --ollama-url
      - http://ollama:11434
      - --host
      - 0.0.0.0
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - type: bind
        source: ${WORKSPACE_PATH:-.}
        target: /workspace
        read_only: true
    depends_on:
      coder79-model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/models', timeout=3).close()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  open-webui: