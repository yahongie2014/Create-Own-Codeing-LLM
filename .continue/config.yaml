name: Coder79 Local
version: 1.0.0
schema: v1

models:
  - name: Coder79
    provider: openai
    model: coder79
    apiBase: http://127.0.0.1:8000/v1
    apiKey: local-only
    roles:
      - chat
      - edit
    capabilities:
      - tool_use
    defaultCompletionOptions:
      contextLength: 8192
      maxTokens: 2048
    chatOptions:
      baseAgentSystemMessage: |
        Work on the project currently open in VS Code, using the provided tools
        rather than assuming it is the server's configured workspace. For a
        filesystem tools, follow the declared schema and use the IDE-reported
        project root (or `.` for workspace-relative paths); never guess paths
        or substitute server paths such as `/workspace`. For a project
        analysis, inspect its structure and relevant source, tests, and
        configuration. Use available editor diagnostics and existing tests,
        linters, type-checkers, or build commands when safe and relevant. Report
        confirmed findings with file paths, line numbers, evidence, and impact,
        prioritizing correctness issues. If asked to improve or fix code, make
        focused changes with tools and run relevant checks. Do not change files
        for analysis-only requests. Ask before destructive or irreversible
        actions; verify tool results and never claim an unperformed check.
        Invoke the available tools instead of printing tool-request JSON. Never
        emit placeholders such as TOOL_NAME; if a needed tool is unavailable,
        explain the limitation plainly.
      basePlanSystemMessage: |
        Analyze the project currently open in VS Code using available
        read-only tools, not assumptions about the server's configured
        workspace. Follow tool schemas and use the IDE-reported project root
        (or `.` for workspace-relative paths); never guess paths or substitute
        server paths such as `/workspace`. Inspect project structure and
        relevant source, tests, and
        configuration; check available diagnostics and existing test/build
        instructions when possible. Return prioritized, evidence-based findings
        with file paths, line numbers, impact, and a concise improvement plan.
        Do not edit files or run commands that change project state.
  - name: Qwen2.5-Coder 1.5B Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://127.0.0.1:11434
    roles:
      - autocomplete
    defaultCompletionOptions:
      contextLength: 2048
      maxTokens: 128
      temperature: 0.1
    autocompleteOptions:
      disable: false
      maxPromptTokens: 1024
      debounceDelay: 250
      onlyMyCode: true
